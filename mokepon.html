<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>¡Mokepon!</title>
        <link rel="stylesheet" href="./styles.css"/>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>
    <body>
        <section id="pet-selection">
            <h1 class="title">🔥💧🌱 ¡Mokepon! 🔥💧🌱</h1>
            <h2 class="subtitle">Elige tu Mokepon:</h2>
            <div id="cardContainer" class="pet-cards">
            </div>
            <button id="btn-pet">Seleccionar</button>
        </section>

        <section id="map-selection">
            <h2 class="subtitle">🔥💧🌱 ¡Recorre el mapa con tu Mokepon! 🔥💧🌱</h2>
            <canvas id="map"></canvas>
            <button onmouseup="detenerMovimiento()" onmousedown="moverArriba()">Arriba</button>
            <div>
                <button onmouseup="detenerMovimiento()" onmousedown="moverIzquierda()">Izquierda</button>
                <button onmouseup="detenerMovimiento()" onmousedown="moverAbajo()">Abajo</button>
                <button onmouseup="detenerMovimiento()" onmousedown="moverDerecha()">Derecha</button>
            </div>
        </section>
    
        <section id="attack-selection">
            <h1 class="title">🔥💧🌱 ¡Mokepon! 🔥💧🌱</h1>  
            <h2 class="subtitle">Elige tu ataque:</h2>
            <div id="attackContainer" class="attack-buttons">
            </div>
            <div>
                <div id="messages">
                    <p id="resultado">Mucha suerte!</p>
                    
                    <section id="restart">
                    <button id="btn-restart">Reiniciar juego</button>
                    </section>    
                </div>
            </div>
            <div class="attacks">
                <div class="player-attacks">
                    <p id="player-life">0</p>
                    <p id="pet-player"></p>
                    <div id="ataques-jugador"> </div>
                </div>
                <div class="enemy-attacks">
                    <p id="enemy-life">0</p>
                    <p id="pet-enemy"></p>
                    <div id="ataques-enemigo"> </div>
                </div>
            </div>
        </section>
        <script src="./js/mokepon.js"></script>
    </body>
</html>
